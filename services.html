<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <div class="header">
        <h1>David</h1>
        <div class="navs">
            <a href="index.html">Home</a>
            <a href="http">Services</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="btn">
            <button><a href="http://">Contact Me</button></a>
        </div>
    </div>
    <div class="services">
        <h2>My Services</h2>
        <p>I Build Scalable websites for performance, SEO and growth</p>
        <div class="serv-box">
            <div class="serv2-box">
                <div class="icon"><i class="fa-brands fa-wordpress"></i></div>
                <h3>Web Design</h3>
                <p>Custom Responsive Sites Focused on UX</p>
            </div>
            <div class="serv2-box">
                <div class="icon"><i class="fa-solid fa-network-wired"></i></div>
                <h3>Networking</h3>
                <p>Create Sites With fast network</p>
            </div>
            <div class="serv2-box">
                <div class="icon"><i class="fa-brands fa-searchengin"></i></div>
                <h3>Search Engine Optimization(SEO)</h3>
                <p>Improve Your Site's Visibility on Search Engines</p>
            </div>
        </div>
        <button><a href="http://">Contact Me <i class="fa-solid fa-circle-chevron-right"></i></button></a>
    </div>
    <footer>&copy;2026 David Wokoma</footer>
    <style>
        body {
            margin: 0;
        }

        .header {
            padding: 10px;
            background: #0b1b34;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: Georgia, Times, 'Times New Roman', serif;
        }

        h1 {
            font-size: 30px;
            color: aliceblue;
        }

        .navs {
            display: flex;
            gap: 20px;
        }

        .navs a {
            text-decoration: none;
            color: aliceblue;
        }

        .btn {
            border: 1px solid aliceblue;
            padding: 9px;
            color: #0b1b34;
            border-radius: 15px;
        }

        .btn a {
            color: #0b1b34;
            text-decoration: none;
        }

        .services {
            background: #081226;
            padding: 20px;
            text-align: center;
        }

        .services h2 {
            color: aliceblue;
            font-size: 35px;
            margin-bottom: 16px;
        }

        .services p {
            color: black;
        }

        .serv-box {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
        }

        .serv2-box {
            flex: 1;
            background: aliceblue;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 10px rgb(252, 249, 249);
        }

        .icon {
            width: 50px;
            height: 50px;
            background: #0a1931;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: aliceblue;
            font-size: 30px;
            margin: 24px;
        }

        .serv2-box h3 {
            color: #0a1931;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .serv2-box p {
            font-size: 12px;
            line-height: 1;
        }

        button {
            border-radius: 10px;
            padding: 15px;
            border: none;
        }

        button a {
            text-decoration: none;
            font-size: 18px;
        }

        footer {
            text-align: center;
            padding: 35px;
            background: #0b1b34;
            margin: 0;
            color: blue;
        }

        @media screen and (max-width:768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .navs {
                gap: 15px;
            }

            .serv-box {
                flex-direction: column;
            }

            .services h2 {
                font-size: 28px;
            }
        }
    </style>
</body>

</html>
