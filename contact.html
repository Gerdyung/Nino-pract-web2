<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <div class="header">
        <h1>David</h1>
        <div class="navs">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="http://">Contact</a>
        </div>
        <div class="btn">
            <button><a href="contact.html">Contact Me</button></a>
        </div>
    </div>
    <div class="contact">
        <h2>Contact Us</h2>
        <p>Give Feedback or message to hire me</p>
    </div>
    <div class="get-in">
        <h3>Get In Touch</h3>
        <div class="get-in-box">
            <div class="get-in2-box">
                <div class="icon"><i class="fa-solid fa-location-dot"></i></div>
                <h4>Location</h4>
                <p>Port Harcourt, Rivers State, Nigeria</p>
            </div>
            <div class="get-in2-box">
                <div class="icon"><i class="fa-solid fa-envelope"></i></div>
                <h4>Email</h4>
                <p>example@email.com</p>
            </div>
            <div class="get-in2-box">
                <div class="icon"><i class="fa-solid fa-phone"></i></div>
                <h4>Phone</h4>
                <p>+234 913 872 334</p>
            </div>
            <div class="get-in2-box">
                <div class="icon"><i class="fa-brands fa-instagram"></i></div>
                <h4>Instagram</h4>
                <p>@example</p>
            </div>
        </div>
    </div>
    <hr>
    <span>Social Media
        <i class="fa-brands fa-tiktok"></i>
        <i class="fa-brands fa-amazon"></i>
        <i class="fa-brands fa-youtube"></i>
    </span>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3975.6029379832717!2d7.055030674084276!3d4.838039095137565!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1069cd7304fb09e7%3A0x20c172f9fe51a6ac!2s94%20Elijiji%20Avenue%2C%20Trans%20Amadi%2C%20Port%20Harcourt%20500102%2C%20Rivers!5e0!3m2!1sen!2sng!4v1794226535845!5m2!1sen!2sng"
        width="500" height="250" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <footer>&copy;2026 David Wokoma</footer>
    <style>
        body {
            margin: 0;
        }

        .header {
            padding: 10px;
            background: #0b1b34;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: Georgia, Times, 'Times New Roman', serif;
        }

        h1 {
            font-size: 30px;
            color: aliceblue;
        }

        .navs {
            display: flex;
            gap: 20px;
        }

        .navs a {
            text-decoration: none;
            color: aliceblue;
        }

        .btn {
            border: 1px solid aliceblue;
            padding: 9px;
            color: #0b1b34;
            border-radius: 15px;
        }

        .btn a {
            color: #0b1b34;
            text-decoration: none;
        }

        .contact {
            text-align: center;
            padding: 15px;
            background: #081226;
            color: aliceblue;
        }

        .contact h2 {
            font-size: 35px;
            position: relative;
            bottom: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .contact p {
            position: relative;
            bottom: 35px;
            font-size: 18px;
        }

        .get-in {
            padding: 15px;
            background: #0a1931;
            color: aliceblue;
        }

        .get-in h3 {
            text-align: center;
            font-size: 25px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            position: relative;
            bottom: 20px;
        }

        .get-in-box {
            display: flex;
            justify-content: space-between;
        }

        .get-in2-box h4 {
            font-size: 18px;
            position: relative;
            bottom: 15px;
        }

        .get-in2-box p {
            font-size: 14px;
            position: relative;
            bottom: 20px;
        }

        span {
            color: blue;
            margin: 10px;
        }

        footer {
            text-align: center;
            padding: 35px;
            background: #0b1b34;
            margin: 0;
            color: blue;
        }

        @media screen and (max-width:768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .navs {
                gap: 15px;
            }

            .get-in-box {
                flex-direction: column;
            }

            iframe {
                height: 250px;
            }
        }
    </style>
</body>

</html>
